spring.application.name=employee-service

# ============ PORT ============
# Employee Service answers on http://localhost:8081
server.port=8081

# ============ DATABASE ============
# ONE PostgreSQL database (HRMS) is now shared by all five services; each
# service owns a PRIVATE SCHEMA inside it -> employee-service owns
# employee_schema. leave-service must NEVER read or write employee_schema.
# The password is NOT hardcoded: set the DB_PASSWORD environment variable.
spring.datasource.url=jdbc:postgresql://localhost:5432/HRMS
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# ============ JPA / HIBERNATE ============
# "update" = create tables on first run, keep data afterwards (beginner-friendly).
# In real production you would use migration scripts (Flyway) instead.
spring.jpa.hibernate.ddl-auto=update
# Log the SQL Hibernate generates - great for learning what JPA does internally:
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# EVERY table this service creates/reads/writes lives in employee_schema.
# Hibernate qualifies all generated SQL with this schema, so services that
# share one database can never accidentally touch each other's tables.
spring.jpa.properties.hibernate.default_schema=employee_schema
# Create employee_schema automatically if it does not exist yet (still inside
# the HRMS database - no new database is created).
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ============ SECURITY / JWT ============
# employee-service does NOT issue tokens - login lives in auth-service (:8085).
# It only VERIFIES the JWTs on incoming requests, which works because this is
# the SAME secret auth-service signs with (share it via an env variable in
# real deployments; keep it out of version control).
app.jwt.secret=hrms-learning-demo-secret-key-change-me-in-production-1234567890
# No generated in-memory user/password here; auth-service owns login/passwords.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ============ SERVICE REGISTRY (EUREKA) ============
# Where to REGISTER myself when I start. My name comes from
# spring.application.name=employee-service; my port from server.port.
# The registry dashboard: http://localhost:8761
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
