spring.application.name=discovery-server

# ============ PORT ============
# Convention: Eureka runs on 8761. Dashboard: http://localhost:8761
server.port=8761

# ============ BE A STANDALONE REGISTRY ============
# Two settings that look strange but make total sense:
# - register-with-eureka=false : the registry must not register ITSELF
# - fetch-registry=false       : the registry must not look OTHERS up -
#                                it IS the lookup. (These make it a
#                                standalone server instead of a peer.)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
