spring.application.name=api-gateway

# ============ PORT ============
# The ONE address the React frontend will talk to: http://localhost:8080
server.port=8080

# ============ ROUTES ============
# A route = "when a request matches this rule, forward it there".
#
#   React calls                          Gateway forwards to
#   -----------                          -------------------
#   http://localhost:8080/api/employees  ->  lb://employee-service
#   http://localhost:8080/api/leaves     ->  lb://leave-service
#
# lb:// = "load-balanced lookup by NAME": ask Eureka for live instances of
# that service, let LoadBalancer pick one, forward there. No ports in this
# file anymore - start employee-service on 9091 and it still just works.
#
# Path=/api/employees/**  : the matching rule (the "predicate")
# StripPrefix=1           : removes the FIRST path segment (/api) before forwarding,
#                           because employee-service listens on /employees

spring.cloud.gateway.server.webflux.routes[0].id=employee-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://employee-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/employees/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=leave-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://leave-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/leaves/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

#   http://localhost:8080/api/attendance ->  lb://attendance-service
spring.cloud.gateway.server.webflux.routes[2].id=attendance-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://attendance-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/attendance/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# ============ CORS (gateway ONLY - the services stay untouched) ============
# The React dev server runs on http://localhost:5173 (Vite default).
# Browser rule: JavaScript on origin A may only call origin B if B answers
# with "Access-Control-Allow-Origin" headers. So the GATEWAY must be allowed
# to say "5173 may call me". The two microservices never talk to the browser,
# so they need no CORS config at all.
#
# (Before every POST/PUT/DELETE with JSON, the browser first sends an OPTIONS
#  "preflight" request - these settings make the gateway answer it correctly.)
# Both loopback spellings are allowed: the browser origin must match EXACTLY.
# http://localhost:5173 and http://127.0.0.1:5173 are DIFFERENT origins for CORS.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173,http://127.0.0.1:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].maxAge=3600

# ============ SERVICE REGISTRY (EUREKA) ============
# The gateway is also just a Eureka CLIENT: it registers itself (so other
# tools could find IT) and looks up employee-service / leave-service here.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
