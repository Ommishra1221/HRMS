spring.application.name=leave-service

# ============ PORT ============
# Leave Service answers on http://localhost:8082
server.port=8082

# ============ DATABASE ============
# Leave Service owns ONLY leave_db. Employee data is NOT here - it is fetched
# over HTTP from employee-service. Two services, two databases.
spring.datasource.url=jdbc:postgresql://localhost:5432/leave_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# ============ JPA / HIBERNATE ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============ MICROSERVICE COMMUNICATION ============
# OLD WAY (deleted): employee.service.url=http://localhost:8081
# NEW WAY: EmployeeClient now says @FeignClient(name="employee-service")
# with NO url. At call time Spring asks Eureka "where is employee-service?",
# gets the live instance list, and Spring Cloud LoadBalancer picks one.
# Move employee-service to another port/machine -> NOTHING changes here.

# ============ SERVICE REGISTRY (EUREKA) ============
# Where to REGISTER myself and look others up.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
