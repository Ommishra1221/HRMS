spring.application.name=payroll-service

# ============ PORT ============
# Payroll Service answers on http://localhost:8084
# (8081 employee, 8082 leave, 8083 attendance -> payroll takes the next one)
server.port=8084

# ============ DATABASE ============
# All services share ONE PostgreSQL database (HRMS); each owns a PRIVATE SCHEMA.
# Payroll Service owns ONLY payroll_schema. Employee data is NOT here - it is
# fetched over HTTP from employee-service.
# The password is NOT hardcoded: set the DB_PASSWORD environment variable.
spring.datasource.url=jdbc:postgresql://localhost:5432/HRMS
spring.datasource.username=postgres
spring.datasource.password=postgres

# ============ JPA / HIBERNATE ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# EVERY table lives in payroll_schema - never in another service's schema.
spring.jpa.properties.hibernate.default_schema=payroll_schema
# Create payroll_schema automatically if it does not exist yet (still inside
# the HRMS database - no new database is created).
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ============ SECURITY / JWT ============
# payroll-service does NOT issue tokens - login lives in auth-service (:8085).
# It only VERIFIES the JWTs on incoming requests, which works because this is
# the SAME secret auth-service signs with (share it via an env variable in
# real deployments; keep it out of version control).
app.jwt.secret=hrms-learning-demo-secret-key-change-me-in-production-1234567890
# No generated in-memory user/password here; auth-service owns login/passwords.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ============ SERVICE REGISTRY (EUREKA) ============
# Where to REGISTER myself and look others up.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
