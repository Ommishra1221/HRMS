                        - text: 🚀 What started as a goal to learn Microservices turned into a project I’m genuinely proud of.After spending many days building, debugging, learning, breaking things, fixing them, and understanding how everything connects, I’ve completed my HRMS (Human Resource Management System) project.I started this project with one simple goal:I wanted to learn Microservices by actually building something from scratch.Instead of only learning concepts theoretically, I wanted to understand how services communicate, how databases are separated, how authentication works, how business logic is handled, and how a complete application comes together.🛠️ Tech StackJava • Spring Boot • Microservices • React • PostgreSQL • Spring Security • JWT • OpenFeign • Eureka • API Gateway📌 Main Modules👥 Employee Management📝 Leave Management⏰ Attendance Management💰 Payroll Management🔐 Authentication & Role-Based AccessI also implemented three different roles:ADMIN — full system managementHR — operational/read accessEMPLOYEE — self-service and own-data accessOne of the biggest things I learned from this project is that building a project is not only about writing code.It is also about understanding why the architecture is designed a certain way, debugging problems, handling security, designing business rules, and connecting everything together.I built this project with a lot of effort and honestly, with my heart. My goal was to create something practical rather than just another tutorial project, and I designed it as a possible foundation for small startups or teams that need basic HR management functionality, depending on their requirements.This project has been a big learning milestone for me, especially in Spring Boot, Microservices, Spring Security, JWT, Feign, Eureka, PostgreSQL and React.One project. Many lessons. A lot of growth. 🚀I’d love to hear from developers working with Java or Microservices:What would you improve or add to this architecture?
