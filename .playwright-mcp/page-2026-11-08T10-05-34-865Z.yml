                        - text: My first post showed what I built. This one shows how I built it. 🚀I’ve been working on an HRMS (Human Resource Management System) to understand how a real-world Microservices architecture works.The application is divided into multiple independent services:🧑‍💼 Employee Service📝 Leave Service⏰ Attendance Service💰 Payroll Service🔐 Auth ServiceThe communication flow looks like:React → API Gateway → MicroserviceFor service-to-service communication, I used OpenFeign, while Eureka handles service discovery.For example:Leave → OpenFeign → EmployeePayroll → OpenFeign → EmployeeAttendance → OpenFeign → EmployeeEach service also has its own PostgreSQL database, rather than directly accessing another service's database.Working on this project has helped me understand concepts beyond just writing Spring Boot APIs — service discovery, API Gateway, inter-service communication, database isolation, authentication, and designing service boundaries.I'm building this project step by step to strengthen my understanding of Java + Spring Boot + Microservices.Still learning. Still building. 🚀
