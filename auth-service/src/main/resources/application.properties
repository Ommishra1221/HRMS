spring.application.name=auth-service

# ============ PORT ============
# Auth Service answers on http://localhost:8085
# (8081 employee, 8082 leave, 8083 attendance, 8084 payroll -> auth takes the next one)
server.port=8085

# ============ DATABASE ============
# All services share ONE PostgreSQL database (HRMS); each owns a PRIVATE SCHEMA.
# Auth Service owns ONLY auth_schema: the users, roles and users_roles tables
# live there and nowhere else - we never reach into the other four schemas.
# The password is NOT hardcoded: set the DB_PASSWORD environment variable.
spring.datasource.url=jdbc:postgresql://localhost:5432/HRMS
spring.datasource.username=postgres
spring.datasource.password=postgres
# ============ JPA / HIBERNATE ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# users + roles + users_roles are ALL created/read inside auth_schema.
spring.jpa.properties.hibernate.default_schema=auth_schema
# Create auth_schema automatically if it does not exist yet (still inside the
# HRMS database - no new database is created).
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ============ SECURITY / JWT ============
# The secret used to SIGN tokens (HMAC-SHA256). Anyone holding this secret can
# forge valid tokens -> in real projects it comes from an env variable and is
# long and random. Here it is externalized via app.jwt.secret so you can see
# the pattern; it must be at least 32 chars for HS256.
app.jwt.secret=hrms-learning-demo-secret-key-change-me-in-production-1234567890
# Token lifetime in milliseconds: 86400000 = 24 hours.
app.jwt.expiration-ms=86400000

# ============ SERVICE REGISTRY (EUREKA) ============
# Where to REGISTER myself. Auth looks nobody up - no fetch needed, but we
# keep the same three lines as every other service for consistency.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
