spring.application.name=attendance-service

server.port=8083

# ONE PostgreSQL database (HRMS), one PRIVATE SCHEMA per service.
# attendance-service owns attendance_schema only.
# The password is NOT hardcoded: set the DB_PASSWORD environment variable.
spring.datasource.url=jdbc:postgresql://localhost:5432/HRMS
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# EVERY table lives in attendance_schema - never in another service's schema.
spring.jpa.properties.hibernate.default_schema=attendance_schema
# Create attendance_schema automatically if it does not exist yet (still inside
# the HRMS database - no new database is created).
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ============ SECURITY / JWT ============
# attendance-service does NOT issue tokens - login lives in auth-service (:8085).
# It only VERIFIES the JWTs on incoming requests, which works because this is
# the SAME secret auth-service signs with (share it via an env variable in
# real deployments; keep it out of version control).
app.jwt.secret=hrms-learning-demo-secret-key-change-me-in-production-1234567890
# No generated in-memory user/password here; auth-service owns login/passwords.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
